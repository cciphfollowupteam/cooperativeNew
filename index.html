<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoopManage | Professional Cooperative Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

    <!-- Auth Page -->
    <div id="auth-page" class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
            <div class="text-center mb-8">
                <div class="bg-indigo-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-200">
                    <i class="fa-solid fa-building-columns text-white text-2xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-800">Welcome Back</h1>
                <p class="text-slate-500">Login to manage your cooperative accounts</p>
            </div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                    <input type="email" id="email" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input type="password" id="password" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg transition-colors shadow-md shadow-indigo-100">
                    Sign In
                </button>
            </form>
        </div>
    </div>

    <!-- App Shell (Hidden by default) -->
    <div id="app-shell" class="hidden min-h-screen flex">
        <!-- Sidebar -->
        <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col">
            <div class="p-6 flex items-center gap-3 text-white">
                <i class="fa-solid fa-building-columns text-indigo-400 text-xl"></i>
                <span class="font-bold text-lg tracking-tight">CoopManage</span>
            </div>
            <nav class="flex-1 px-4 space-y-2 mt-4">
                <a href="#" onclick="showView('dashboard')" class="nav-link active" id="nav-dashboard">
                    <i class="fa-solid fa-chart-pie mr-3"></i> Dashboard
                </a>
                <a href="#" onclick="showView('loans')" class="nav-link" id="nav-loans">
                    <i class="fa-solid fa-hand-holding-dollar mr-3"></i> My Loans
                </a>
                <div id="admin-nav" class="hidden pt-4 mt-4 border-t border-slate-800">
                    <p class="text-xs font-semibold text-slate-500 uppercase px-3 mb-2">Administration</p>
                    <a href="#" onclick="showView('admin-upload')" class="nav-link" id="nav-admin-upload">
                        <i class="fa-solid fa-file-import mr-3"></i> Upload Data
                    </a>
                    <a href="#" onclick="showView('admin-loans')" class="nav-link" id="nav-admin-loans">
                        <i class="fa-solid fa-user-check mr-3"></i> Loan Approvals
                    </a>
                </div>
            </nav>
            <div class="p-4 border-t border-slate-800">
                <button onclick="logout()" class="w-full flex items-center gap-3 px-3 py-2 text-slate-400 hover:text-white transition-colors">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col overflow-hidden">
            <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8">
                <h2 id="view-title" class="text-xl font-semibold text-slate-800">Dashboard</h2>
                <div class="flex items-center gap-4">
                    <span id="user-name" class="text-sm font-medium text-slate-600">Loading...</span>
                    <div class="w-8 h-8 bg-indigo-100 text-indigo-700 rounded-full flex items-center justify-center font-bold text-xs">
                        USER
                    </div>
                </div>
            </header>

            <div id="main-content" class="p-8 overflow-y-auto h-[calc(100vh-64px)]">
                <!-- Views will be injected here by app.js -->
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
